# Explicit opt-in profile. Supply all secrets externally.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    baseline-on-migrate: false
savex:
  jwt:
    secret: ${JWT_SECRET}
  payments:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
