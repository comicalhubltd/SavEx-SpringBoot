# Persistent local integration testing. This profile does not enable real money.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/savex?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:savex_app}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: com.savex.config.XamppMariaDbDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
server:
  address: 127.0.0.1
savex:
  jwt:
    secret: ${JWT_SECRET}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
