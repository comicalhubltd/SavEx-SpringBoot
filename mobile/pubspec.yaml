name: savex
description: SavEx — Digital Group Rotating Savings Platform
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  flutter_secure_storage: ^9.2.2   # JWT tokens
  shared_preferences: ^2.3.2       # settings

  # Navigation
  go_router: ^14.2.7

  # UI
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0                    # currency & date formatting
  pinput: ^5.0.0                   # OTP input

  # Real-time
  web_socket_channel: ^3.0.1

  # Charts (savings progress)
  fl_chart: ^0.69.0

  # Local notifications
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf   weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf     weight: 700
